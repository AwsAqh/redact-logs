name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Manual entry point for the read-only trusted-publishing diagnostic below.
  # The publish job is gated on tag pushes, so a manual run never publishes.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # id-token: write enables OIDC trusted publishing: npm exchanges a
    # short-lived GitHub OIDC token for a registry token, so no long-lived
    # NPM_TOKEN secret is needed.
    #
    # registry-url is deliberately NOT set. setup-node would then write an .npmrc
    # containing "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}", and with the
    # secret unset that placeholder is not resolved to empty -- npm leaves the
    # literal string as the token, which every npm command in the job then reads.
    # npm publish targets the default public registry anyway.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure a trusted-publishing capable npm (>= 11.21.0 / 12.2.0)
        run: npm install --global npm@latest
      - run: npm ci
      - name: Publish
        run: npm publish --loglevel verbose
        # npm only logs why an OIDC token exchange failed at verbose level
        # (npm/cli#9923); at the default level a rejected exchange collapses into
        # the misleading "ENEEDAUTH ... requires you to be logged in", which is
        # what the v0.2.1 tag build showed. Verbose prints the
        # "POST .../oidc/token/exchange/package/..." line plus the registry's own
        # rejection message. npm never logs request headers, so the short-lived
        # exchange token cannot end up in this log.

  # Read-only diagnostic for trusted publishing. It publishes nothing; it asks
  # the registry the same question `npm publish` asks internally and prints the
  # answer, which npm itself hides behind --loglevel verbose.
  diagnose-trusted-publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exchange the OIDC token for a registry token
        run: |
          set -u
          echo "node: $(node --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is missing, so id-token: write was not granted"
            exit 1
          fi
          ID_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.value){console.error('no id_token in response:',s);process.exit(1)}process.stdout.write(j.value)})")
          echo "id token acquired (${#ID_TOKEN} chars)"
          # Print the claims only. The signature is never logged, so this output
          # cannot be replayed, and it shows exactly which repo/workflow/ref the
          # registry will compare against the trusted publisher config.
          # `sub` is printed too: repos created after 2026-07-15 use GitHub's
          # immutable subject format (repo:owner@id/repo@id:ref:...) instead of the
          # legacy repo:owner/repo:ref:..., which the registry is reported to reject
          # with "package not found" even when every other claim matches (npm/cli#9969).
          ID_TOKEN="$ID_TOKEN" node -e "const c=JSON.parse(Buffer.from(process.env.ID_TOKEN.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'),'base64').toString());console.log(JSON.stringify({sub:c.sub,repository:c.repository,repository_owner:c.repository_owner,repository_id:c.repository_id,repository_owner_id:c.repository_owner_id,workflow:c.workflow,workflow_ref:c.workflow_ref,job_workflow_ref:c.job_workflow_ref,ref:c.ref,event_name:c.event_name,environment:c.environment,runner_environment:c.runner_environment,iss:c.iss,aud:c.aud},null,2))"
          echo "--- registry response to the token exchange ---"
          curl -sS -o /tmp/exchange.json -w 'HTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@awsaqh%2Fredact-logs"
          node -e "const j=JSON.parse(require('fs').readFileSync('/tmp/exchange.json','utf8'));if(j.token){console.log('OK: the registry issued a token ('+j.token.length+' chars; value not printed)')}else{console.log('REJECTED, the registry said: '+JSON.stringify(j,null,2));process.exit(1)}"
      # GitHub's OIDC subject-template endpoint (GET .../actions/oidc/customization/sub)
      # needs an "administration" permission, which GITHUB_TOKEN cannot hold -- declaring
      # that key in `permissions` is rejected by Actions and invalidates this whole
      # workflow file. The `sub` claim printed above already reveals the subject format
      # directly, so no separate probe step is needed.