name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # id-token: write enables OIDC trusted publishing: npm exchanges a
    # short-lived GitHub OIDC token for a registry token, so no long-lived
    # NPM_TOKEN secret is needed.
    #
    # registry-url is deliberately NOT set. setup-node would then write an .npmrc
    # containing "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}", and with the
    # secret unset that placeholder is not resolved to empty -- npm leaves the
    # literal string as the token, which every npm command in the job then reads.
    # npm publish targets the default public registry anyway.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure a trusted-publishing capable npm (>= 11.21.0 / 12.2.0)
        run: npm install --global npm@latest
      - run: npm ci
      - name: Publish
        run: npm publish